# ═══════════════════════════════════════════════════════════════════════════
# OpenDEAM — Open Digital Enterprise Architecture Model (v0.5.0)
# Author: Emmanuel A. Otchere (emmanuel@otchere.com)
#
# This file is the SINGLE SOURCE OF TRUTH for the DEA architecture:
# layers → building blocks → entity allocation → relationships.
#
# CHANGE FROM v0.4.0 — see docs/ADRs/ADR-0005-opendeam-v0.5.0-metamodel-governance-resource-information.md
#   - New terminology mechanism: entity_role (content|governance) and
#     completeness_contract — the metamodel is now prescriptive, not just
#     descriptive: category-root/governance entities define what a T2
#     catalog must classify by to be MECE-complete. Applied so far only to
#     the entities below (worked example); retrofitting the other 47 is
#     deferred to a future ADR.
#   - New terminology.metamodel_boundary filter: an entity earns metamodel
#     status only as a category (type-of-type) with its own lifecycle, not
#     as a value/instance/industry-flavor of an existing category (e.g.
#     Cash, Equipment, Lease, Product are catalog instances, not entities).
#   - New: Resource (abstract, L3, new building block L3-resources) with
#     specializations Financial/Physical/Intangible Resource.
#   - New: Information Asset + Knowledge Asset (L4, new building block
#     L4-information-knowledge) — completes Data->Information->Knowledge.
#   - terminology.abstract_entities broadened (review follow-up): abstract now
#     also covers same-layer category roots carrying a completeness_contract,
#     not only cross-layer realization parents.
#
# CHANGE FROM v0.3.0 — see docs/ADRs/ADR-0004-opendeam-v0.4.0-l2-cleanup-vocabulary-purge.md
#   - Removed: Viewpoint (out of scope — belongs to T3 tooling, not architecture).
#   - Merged: Glossary Term + Taxonomy Node -> Concept, demoted to a new
#     orthogonal_allocator "semantic-dimension" (any entity may carry defined_by).
#   - Renamed + wired (previously orphaned, zero relationships each):
#       Principle       -> Tenet      (informs Guardrail; non-binding belief)
#       Standard        -> Guardrail  (governs Technology/Solution Component;
#                                       implements Control; new `enforcement`
#                                       maturity field: advisory..platform-enforced)
#       Reference Model -> Blueprint  (composed of Architecture Pattern)
#   - L2 building blocks: 7 -> 5 (L2-architecture-views, L2-semantics removed).
#   - Standing rule added: no verbatim TOGAF/Zachman/ArchiMate terminology —
#     see terminology.naming_philosophy.
#   - Migration map (old entity_id -> new) for T2 consumers pinned to v0.3.x:
#       dea:entity-principle       -> dea:entity-tenet       (alias PR  -> TNT)
#       dea:entity-standard        -> dea:entity-guardrail    (alias STD -> GRD)
#       dea:entity-reference-model -> dea:entity-blueprint    (alias RM  -> BLU)
#       dea:entity-glossary-term + dea:entity-taxonomy-node -> dea:entity-concept (alias GT/TXN -> CON)
#       dea:entity-viewpoint -> removed, no replacement (alias VP retired)
#
# CHANGE FROM v0.2.0 — see docs/ADRs/ADR-0003-opendeam-v0.3.0-comprehensiveness-expansion.md
#   - New building blocks (comprehensiveness expansion, checked against the
#     axiom-derivation/MECE/not-a-TOGAF-repeat filter — see ADR-0003):
#       L1-ecosystem-platforms   (Ecosystem Platform)
#       L2-risk-compliance       (Risk, Control, Regulation)
#       L2-innovation-foresight  (Signal, Experiment, Technology Radar Entry)
#       L3-people-skills-culture (Skill, Role, Change Initiative)
#       L4-model-operations      (Model Deployment, Model Feedback Signal)
#   - New orthogonal_allocator: ai-automation-governance (governed_by field,
#     reuses Risk/Control/Regulation rather than inventing AI-specific objects).
#   - Deliberately NOT added: an "AI layer" and a "Sustainability" building
#     block — see ADR-0003 "Explicitly rejected candidates".
#
# CHANGE FROM v0.1.0 — see docs/ADRs/ADR-0002-opendeam-v0.2.0-structural-upgrade.md
#   - Measurement (L6) demoted from a numbered layer to a cross-cutting
#     orthogonal_allocator, parallel to the ECF matrix.
#   - Collaboration Agreement moved L2 -> L1 (L1-agreements building block).
#   - Entities gain: abstract, specializes, discriminator, ecf_coordinates, measured_by.
#   - Relationships gain: rel_type (controlled vocabulary), cardinality.
#     style is now DEPRECATED — derive it from rel_type in viewers.
#   - status lifecycle formally defined (see terminology.lifecycle).
#
# Edit rules:
#   - Structural changes (new/removed layer, new dimension, entity re-allocation,
#     backward status transition, retirement) require an ADR in docs/ADRs/ and a
#     minor version bump.
#   - Additive changes (new entity in an existing building block, new
#     relationship, forward status transition) require a PR and a patch version bump.
#   - CI (validate_model.py) must pass. Consumers pin this file by tag.
# ═══════════════════════════════════════════════════════════════════════════

model:
  name: OpenDEAM — Open Digital Enterprise Architecture Model
  id: opendeam
  version: 0.5.0
  status: alpha
  owner_repo: technehub-labs/dea-architecture-framework
  axiom: An enterprise is any bounded entity that persists by exchanging value with its environment.
  supersedes: opendeam-model.yaml v0.4.0 (see ADR-0005)

terminology:
  layer: >
    Architecture layer (L1–L5). Defined exclusively by this model; the word 'Layer' anywhere in
    the org refers to these five. Measurement is NOT a layer as of v0.2.0 — see orthogonal_allocators.measurement-dimension.
  building_block: Named grouping of entities within a layer — the architecture's components at first-level granularity.
  entity: A first-level architecture object allocated to exactly one layer and one building block (MECE), unless abstract=true (see below).
  abstract_entities: >
    An entity may be marked abstract:true in either of two forms: (a) a cross-layer realization
    parent whose concrete subclasses are realized in a different layer than the parent's own layer
    (e.g. Solution Component, realized in L5); or (b) a same-layer category root (added in v0.5.0,
    ADR-0005 D2/D3) whose subclasses share the parent's layer and building block and whose purpose
    is to anchor a category and carry a completeness_contract for its T2 catalogs (e.g. Resource).
    Both forms declare realized_in_layers (which must include every subclass's layer).
    Concrete subclasses declare specializes: <parent entity_id> and are allocated normally (single layer, MECE).
  shared_catalog_convention: >
    A catalog_repo MAY be shared by multiple entities only if every entity sharing it declares a
    discriminator field naming the entity property that distinguishes its instances within that
    repo (mirrors the component_type pattern used by Solution Component subclasses).
  lifecycle:
    states_ordered: [proposed, planned, scaffold, existing, deprecated, retired]
    forward_transition: Requires a PR and a patch version bump.
    backward_transition_or_retirement: Requires an ADR and a minor version bump.
  naming_philosophy: >
    Added in v0.4.0 (ADR-0004 D7). Before naming a new entity, check it against TOGAF's Content
    Metamodel, Zachman's cell labels, and ArchiMate's element catalog. A word match alone is not
    disqualifying (generic English like "Process," "Actor," "Service" is fine). A *conceptual*
    match to a classical-EA static-documentation artifact (catalog, matrix cell, reference model,
    principle) requires the reframe test: does naming it around what it actually does — automate,
    enforce, compose, link — change its relationships, or only its label? If only the label
    changes, skip the rename. If relationships follow from the reframe, it's a real fix.
  metamodel_boundary: >
    Added in v0.5.0 (ADR-0005 D1). OpenDEAM is a metamodel (type-of-type); a T2 catalog is an
    information model (type, or instance-of-type). A candidate entity earns metamodel status only
    if it names a category with its own distinct lifecycle and relationship pattern, applicable
    to any enterprise regardless of industry. If a candidate is actually a specific value,
    instance, or industry-specific flavor of a category that already exists (e.g. Cash, Equipment,
    a specific Lease, a specific Product), it belongs in the T2 catalog governed by that entity's
    schema, not as a new metamodel entity. Every entity implicitly defines a zoom-in boundary: the
    catalog repo it governs is where an org's own sub-taxonomy lives, out of scope for the root
    model by design, not by omission.
  entity_role: >
    Added in v0.5.0 (ADR-0005 D2). Optional field on an entity: content (an enterprise operates
    with it; populated by T2 catalogs — e.g. Business Process, Data Entity, Financial Resource) or
    governance (exists to constrain or define the shape of other entities' catalogs — e.g.
    Concept, Architecture Pattern, Blueprint, Tenet, Guardrail). Applied so far only to entities
    introduced in ADR-0005 as a worked example; retrofitting the rest is a deferred future ADR.
  completeness_contract: >
    Added in v0.5.0 (ADR-0005 D2). Optional field, carried by abstract category roots and
    governance-role entities, stating what a T2 catalog under that entity must classify by or
    satisfy to count as MECE-complete. Makes the metamodel prescriptive (defines what must exist
    for a catalog to be complete), not merely descriptive (defines what a catalog may contain).

architecture:
  layers:
    - id: L1
      name: Ecosystem & Value Network
      qualifier: External
      color: '#2DD4BF'
      derivation: '"with its environment" — the exchange surface between the bounded enterprise and its ecosystem.'
      building_blocks:
        - id: L1-external-parties
          name: External Parties
        - id: L1-value-flows
          name: Value Flows
        - id: L1-experience-points
          name: Experience Points
        - id: L1-agreements
          name: Collaboration Agreements
          note: Moved from L2 in v0.2.0 (ADR-0002 D2) — an agreement is a feature of the exchange surface, not internal governance.
        - id: L1-ecosystem-platforms
          name: Ecosystem Platforms
          note: Added in v0.3.0 (ADR-0003 D1) — multi-sided platform hosting, distinct from bilateral Value Exchange.

    - id: L2
      name: Strategic & Governance
      qualifier: Intent & Rules
      color: '#FBBF24'
      derivation: '"persists" — intent to persist expressed as objectives, and the rules that constrain behaviour.'
      building_blocks:
        - id: L2-intent
          name: Strategic Intent
        - id: L2-rules-guidance
          name: Tenets & Guardrails
          note: Renamed in v0.4.0 (ADR-0004 D3/D4) from "Rules & Guidance" — Principle renamed Tenet, Standard renamed Guardrail, both now wired to real relationships.
        - id: L2-reusable-knowledge
          name: Patterns & Blueprints
          note: Renamed in v0.4.0 (ADR-0004 D5) from "Reusable Knowledge" — Reference Model renamed Blueprint, now composed of Architecture Pattern.
        - id: L2-risk-compliance
          name: Risk & Compliance
          note: Added in v0.3.0 (ADR-0003 D2) — "persists" requires managing existential/regulatory risk as a condition, not an activity layered on top.
        - id: L2-innovation-foresight
          name: Innovation & Foresight
          note: Added in v0.3.0 (ADR-0003 D3) — sensing environmental change before it forces adaptation; formal home for pre-adoption AI/tech tracking.

    - id: L3
      name: Business Operating Model
      qualifier: Internal
      color: '#38BDF8'
      derivation: '"bounded entity" — how the enterprise internally organises and performs work.'
      building_blocks:
        - id: L3-work-organization
          name: Work Organization
        - id: L3-value-delivery
          name: Value Delivery
        - id: L3-business-information
          name: Business Information
        - id: L3-service-offerings
          name: Service Offerings
        - id: L3-people-skills-culture
          name: People, Skills & Culture
          note: Added in v0.3.0 (ADR-0003 D4) — capability of the people themselves and the change effort to shift it, distinct from formal structure.
        - id: L3-resources
          name: Enterprise Resources
          note: Added in v0.5.0 (ADR-0005 D3) — the tangible/economic substrate a bounded entity maintains to persist, distinct from what it exchanges (L1) or builds digitally (L4/L5). Makes the model hold for a non-digital-native small business, not only a platform business.

    - id: L4
      name: Digital & Intelligence
      qualifier: Data & Brain
      color: '#A78BFA'
      derivation: '"exchanging value" (digital plane) — the digital representation of work and the intelligence applied to it.'
      building_blocks:
        - id: L4-digital-trust
          name: Digital Trust
        - id: L4-data-foundation
          name: Data Foundation
        - id: L4-data-products
          name: Data Products
        - id: L4-intelligence
          name: Intelligence
        - id: L4-events
          name: Events & Streams
        - id: L4-model-operations
          name: Model Operations
          note: Added in v0.3.0 (ADR-0003 D5) — deployment/monitoring/retraining lifecycle of AI/ML Models, parallel to how L5 separates Systems from Infrastructure. Deliberately not a top-level "AI layer" — see ADR-0003.
        - id: L4-information-knowledge
          name: Information & Knowledge
          note: Added in v0.5.0 (ADR-0005 D4) — completes Data->Information->Knowledge on the digital plane. Wisdom deliberately excluded (fails the non-generic-derivation filter).

    - id: L5
      name: Technology & Execution
      qualifier: Systems & Infra
      color: '#FB7185'
      derivation: '"persists" (execution plane) — the substrate that executes and hosts the digital plane.'
      building_blocks:
        - id: L5-systems
          name: Systems & Applications
        - id: L5-integration
          name: Integration
        - id: L5-infrastructure
          name: Infrastructure & Platforms
        - id: L5-technology
          name: Technology Portfolio

  orthogonal_allocators:
    - id: ecf-matrix
      name: Enterprise Concept Framework matrix (7×7)
      owner_repo: technehub-labs/dea-metaframework
      kind: city-block grid (domain × stage)
      description: >
        Orthogonal allocation structure owned by dea-metaframework. Entities may carry
        ecf_coordinates referencing matrix cells (e.g. Business Capability, Business Object).
        OpenDEAM references the matrix; it does not redefine it.
      reference: https://github.com/technehub-labs/dea-metaframework/blob/main/framework/matrix.md

    - id: measurement-dimension
      name: Measurement Dimension
      owner_repo: technehub-labs/dea-architecture-framework
      kind: cross-cutting evaluative overlay (not a layer as of v0.2.0)
      description: >
        Replaces the former L6 layer (see ADR-0002 D1). Any entity in L1–L5 may declare
        measured_by: [metric entity_ids]. Metric entities declare scope_layers to state which
        layers they are permitted to evaluate. This models "persistence over time requires
        feedback" as a dimension applied across the architecture rather than a sixth layer.
      reference: null

    - id: ai-automation-governance
      name: AI & Automation Governance
      owner_repo: technehub-labs/dea-architecture-framework
      kind: cross-cutting policy overlay (not a layer, not "Responsible AI" as a separate structure)
      description: >
        Added in v0.3.0 (ADR-0003 D6). Any AI-driven entity (Actor of AI-agent subtype, AI/ML Model,
        or a System Function with an enhances/automates relationship from an AIM) may declare
        governed_by: [Risk/Control/Regulation entity_ids], reusing L2-risk-compliance entities
        rather than inventing AI-specific governance objects. Deliberately not a separate layer —
        see ADR-0003 explicit rejection of a "Responsible AI" layer.
      reference: null

    - id: semantic-dimension
      name: Semantic Dimension
      owner_repo: technehub-labs/dea-architecture-framework
      kind: cross-cutting concept graph (not a layer, not a static glossary)
      description: >
        Added in v0.4.0 (ADR-0004 D2), replacing the L2-semantics building block. Merges the
        former Glossary Term and Taxonomy Node into a single Concept entity. Any entity across
        L1–L5 may carry defined_by: [Concept ids]. Framed as a queryable concept graph rather
        than a static glossary document — consistent with modern data-catalog/knowledge-graph
        practice rather than classical EA's documentation-shelf model.
      reference: null

allocation:
  entities:
    - entity_id: dea:entity-ecosystem-actor
      class_alias: EA
      display_name: Ecosystem Actor
      layer: L1
      building_block: L1-external-parties
      status: planned
      catalog_repo: null
      description: 'External party that actively exchanges value with the enterprise — supplier, customer, regulator, partner.'

    - entity_id: dea:entity-journey-touchpoint
      class_alias: JT
      display_name: Journey Touchpoint
      layer: L1
      building_block: L1-experience-points
      status: planned
      catalog_repo: dea-catalog-journey-touchpoints
      description: A point of interaction on a customer or user journey, across a specific channel.

    - entity_id: dea:entity-stakeholder
      class_alias: SH
      display_name: Stakeholder
      layer: L1
      building_block: L1-external-parties
      status: scaffold
      catalog_repo: dea-catalog-stakeholders
      description: An external or affected party whose relationship with the enterprise is engaged in or affected by enterprise processes.

    - entity_id: dea:entity-value-exchange
      class_alias: VE
      display_name: Value Exchange
      layer: L1
      building_block: L1-value-flows
      status: planned
      catalog_repo: null
      description: A flow of value between the enterprise and an ecosystem actor — information, goods, or funds; inbound or outbound.

    - entity_id: dea:entity-collaboration-agreement
      class_alias: CA
      display_name: Collaboration Agreement
      layer: L1
      building_block: L1-agreements
      status: planned
      catalog_repo: null
      description: Terms governing cooperation with an ecosystem actor — cooperative or mandated.
      migration_note: Reallocated from L2-agreements to L1-agreements in v0.2.0 (ADR-0002 D2).

    - entity_id: dea:entity-ecosystem-platform
      class_alias: EP
      display_name: Ecosystem Platform
      layer: L1
      building_block: L1-ecosystem-platforms
      status: proposed
      catalog_repo: dea-catalog-ecosystem-platforms
      description: A standing multi-sided structure the enterprise hosts for repeated exchange among many ecosystem actors (marketplace, partner API program, developer portal).

    - entity_id: dea:entity-architecture-pattern
      class_alias: AP
      display_name: Architecture Pattern
      layer: L2
      building_block: L2-reusable-knowledge
      status: planned
      catalog_repo: dea-catalog-patterns
      discriminator: pattern_kind
      description: A reusable architecture pattern (e.g. API Gateway, Event Sourcing, CQRS) that resolves a recurring design problem.

    - entity_id: dea:entity-concept
      class_alias: CON
      display_name: Concept
      status: proposed
      catalog_repo: dea-catalog-concepts
      scope_layers: [L1, L2, L3, L4, L5]
      parent_concept: null
      description: >
        A canonical, definable unit of meaning (business term or classification node) that other
        entities link to via defined_by. Merged from Glossary Term + Taxonomy Node in v0.4.0
        (ADR-0004 D2); framed as a queryable concept graph, not a static glossary document. No
        longer allocated to a layer/building_block — belongs to orthogonal_allocators.semantic-dimension.

    - entity_id: dea:entity-investment-initiative
      class_alias: II
      display_name: Investment Initiative
      layer: L2
      building_block: L2-intent
      status: planned
      catalog_repo: dea-catalog-investment-initiatives
      description: A funded programme of work that realises one or more strategic objectives.

    - entity_id: dea:entity-tenet
      class_alias: TNT
      display_name: Tenet
      layer: L2
      building_block: L2-rules-guidance
      status: planned
      catalog_repo: dea-catalog-tenets
      migration_note: Renamed from Principle (PR) in v0.4.0 (ADR-0004 D3) — a non-binding belief that informs Guardrails, rather than a standalone documentation-catalog entry.
      description: A non-binding, human-authored belief that guides decisions (e.g. API-first, prefer managed services). Informs one or more Guardrails; enforces nothing on its own.

    - entity_id: dea:entity-blueprint
      class_alias: BLU
      display_name: Blueprint
      layer: L2
      building_block: L2-reusable-knowledge
      status: planned
      catalog_repo: dea-catalog-blueprints
      migration_note: Renamed from Reference Model (RM) in v0.4.0 (ADR-0004 D5) — now explicitly composed of Architecture Patterns rather than standing alone.
      description: A composed, reusable target-state design assembled from Architecture Patterns, providing a template for solution design.

    - entity_id: dea:entity-strategic-objective
      class_alias: SO
      display_name: Strategic Objective
      layer: L2
      building_block: L2-intent
      status: planned
      catalog_repo: dea-catalog-strategic-objectives
      description: A high-level enterprise outcome the organisation seeks to achieve.

    - entity_id: dea:entity-guardrail
      class_alias: GRD
      display_name: Guardrail
      layer: L2
      building_block: L2-rules-guidance
      status: planned
      catalog_repo: dea-catalog-guardrails
      enforcement: automated-block
      migration_note: Renamed from Standard (STD) in v0.4.0 (ADR-0004 D4) — now governs Technology/Solution Component and implements Control, closing the gap where Technology claimed to be "governed via Standards" with no such relationship existing.
      description: >
        An enforceable constraint on technology or solution choices. Carries an enforcement
        maturity level (advisory | automated-warn | automated-block | platform-enforced) —
        modeling policy-as-code / platform-guardrail practice rather than a static compliance
        document someone checks against manually.

    - entity_id: dea:entity-risk
      class_alias: RSK
      display_name: Risk
      layer: L2
      building_block: L2-risk-compliance
      status: proposed
      catalog_repo: dea-catalog-risk-register
      description: A condition or event that threatens the enterprise's ability to persist or to realize a capability/objective.

    - entity_id: dea:entity-control
      class_alias: CTL
      display_name: Control
      layer: L2
      building_block: L2-risk-compliance
      status: proposed
      catalog_repo: dea-catalog-controls
      description: A mechanism (process, technical, or organizational) that mitigates a Risk or enforces a Regulation.

    - entity_id: dea:entity-regulation
      class_alias: REG
      display_name: Regulation
      layer: L2
      building_block: L2-risk-compliance
      status: proposed
      catalog_repo: dea-catalog-regulations
      description: An externally imposed obligation (law, industry standard with force, contractual mandate) the enterprise must comply with.

    - entity_id: dea:entity-signal
      class_alias: SIG
      display_name: Signal
      layer: L2
      building_block: L2-innovation-foresight
      status: proposed
      catalog_repo: dea-catalog-signals
      description: A weak or early indicator of environmental change (market, technology, regulatory, competitive) worth tracking before it forces adaptation.

    - entity_id: dea:entity-experiment
      class_alias: EXP
      display_name: Experiment
      layer: L2
      building_block: L2-innovation-foresight
      status: proposed
      catalog_repo: dea-catalog-experiments
      description: A bounded, time-boxed test of a Signal's relevance to the enterprise before committing investment.

    - entity_id: dea:entity-technology-radar-entry
      class_alias: TRE
      display_name: Technology Radar Entry
      layer: L2
      building_block: L2-innovation-foresight
      status: proposed
      catalog_repo: dea-catalog-technology-radar
      description: An emerging technology or technique being tracked (assess/trial/adopt/hold) prior to becoming a governed L5 Technology.

    - entity_id: dea:entity-actor
      class_alias: AC
      display_name: Actor
      layer: L3
      building_block: L3-work-organization
      status: scaffold
      catalog_repo: dea-catalog-actors
      description: A performer of enterprise processes — human, team, system, or AI agent.

    - entity_id: dea:entity-business-function
      class_alias: BF
      display_name: Business Function
      layer: L3
      building_block: L3-work-organization
      status: planned
      catalog_repo: null
      description: A grouping of business capabilities by organisational function; owned by an organizational unit.

    - entity_id: dea:entity-business-object
      class_alias: BO
      display_name: Business Object
      layer: L3
      building_block: L3-business-information
      status: scaffold
      catalog_repo: dea-catalog-business-objects
      ecf_coordinates: {domain: null, stage: null}
      description: A real-world entity of interest to the business (e.g. Customer, Order). The atom of the ECF matrix.

    - entity_id: dea:entity-process
      class_alias: BP
      display_name: Business Process
      layer: L3
      building_block: L3-value-delivery
      status: scaffold
      catalog_repo: dea-catalog-processes
      measured_by: [MTR]
      description: A structured set of activities that produces a defined outcome.

    - entity_id: dea:entity-business-service
      class_alias: BS
      display_name: Business Service
      layer: L3
      building_block: L3-service-offerings
      status: existing
      catalog_repo: dea-catalog-digital-business-service-factory
      description: A service exposed to the business or to external consumers. Composite of capabilities, realised by solution components.

    - entity_id: dea:entity-capability
      class_alias: CAP
      display_name: Business Capability
      layer: L3
      building_block: L3-value-delivery
      status: planned
      catalog_repo: dea-catalog-business-capabilities
      ecf_coordinates: {domain: null, stage: null}
      measured_by: [MTR]
      description: An ability the business possesses or requires to deliver value. Maps to ECF coordinates.

    - entity_id: dea:entity-organizational-unit
      class_alias: OU
      display_name: Organizational Unit
      layer: L3
      building_block: L3-work-organization
      status: scaffold
      catalog_repo: dea-catalog-organizational-units
      description: A unit of organisation that owns capabilities, runs processes, and is custodian for business objects.

    - entity_id: dea:entity-solution-component
      class_alias: SC
      display_name: Solution Component
      layer: L3
      building_block: L3-service-offerings
      status: existing
      catalog_repo: dea-catalog-digital-business-service-factory
      abstract: true
      realized_in_layers: [L5]
      description: >
        Abstract parent of ApplicationComponent, InfrastructureComponent, IntegrationComponent
        (discriminated union by component_type). Concrete subclasses are allocated to L5;
        see specializes on APC/IFC/IGC below. (ADR-0002 D3)

    - entity_id: dea:entity-value-stream
      class_alias: VS
      display_name: Value Stream
      layer: L3
      building_block: L3-value-delivery
      status: planned
      catalog_repo: dea-catalog-value-streams
      description: An end-to-end collection of value-creating activities spanning multiple capabilities and processes.

    - entity_id: dea:entity-resource
      class_alias: RES
      display_name: Resource
      layer: L3
      building_block: L3-resources
      status: proposed
      catalog_repo: null
      abstract: true
      realized_in_layers: [L3]
      entity_role: content
      completeness_contract: >
        Any T2 catalog specializing Resource must classify instances along exactly one of three
        dimensions: liquidity (-> Financial Resource), maintenance regime (-> Physical Resource),
        or legal protection type (-> Intangible Resource). Each dimension implies a distinct
        governance/relationship pattern, not merely a different label. (ADR-0005 D3)
      description: The economic/physical substrate a bounded entity maintains to persist, distinct from what it exchanges (L1) or builds digitally (L4/L5).

    - entity_id: dea:entity-financial-resource
      class_alias: FR
      display_name: Financial Resource
      layer: L3
      building_block: L3-resources
      status: proposed
      catalog_repo: dea-catalog-financial-resources
      specializes: RES
      entity_role: content
      description: Liquid or near-liquid economic value the enterprise holds (accounts, instruments, funding lines). Catalog instances include cash, credit facilities, and similar.

    - entity_id: dea:entity-physical-resource
      class_alias: PHR
      display_name: Physical Resource
      layer: L3
      building_block: L3-resources
      status: proposed
      catalog_repo: dea-catalog-physical-resources
      specializes: RES
      entity_role: content
      description: Tangible assets requiring an ongoing maintenance regime (equipment, vehicles, premises, inventory stock). Catalog instances include an oven, a van, a warehouse shelf.

    - entity_id: dea:entity-intangible-resource
      class_alias: INR
      display_name: Intangible Resource
      layer: L3
      building_block: L3-resources
      status: proposed
      catalog_repo: dea-catalog-intangible-resources
      specializes: RES
      entity_role: content
      description: Legally protected non-physical economic value (patents, trademarks, brand equity, licenses). Catalog instances include a specific trademark registration or license.

    - entity_id: dea:entity-skill
      class_alias: SKL
      display_name: Skill
      layer: L3
      building_block: L3-people-skills-culture
      status: proposed
      catalog_repo: dea-catalog-skills
      description: A capability an individual Actor possesses or must develop. Distinct from Business Capability, which belongs to the enterprise, not a person.

    - entity_id: dea:entity-role
      class_alias: ROL
      display_name: Role
      layer: L3
      building_block: L3-people-skills-culture
      status: proposed
      catalog_repo: dea-catalog-roles
      description: A defined set of required Skills and responsibilities that an Actor fulfills within an Organizational Unit.

    - entity_id: dea:entity-change-initiative
      class_alias: CHI
      display_name: Change Initiative
      layer: L3
      building_block: L3-people-skills-culture
      status: proposed
      catalog_repo: dea-catalog-change-initiatives
      description: A deliberate effort to shift Skills, Roles, or culture within an Organizational Unit, typically funded by an Investment Initiative.

    - entity_id: dea:entity-ai-ml-model
      class_alias: AIM
      display_name: AI/ML Model
      layer: L4
      building_block: L4-intelligence
      status: planned
      catalog_repo: dea-catalog-ai-ml-models
      governed_by: []
      description: A machine-learning or AI model that augments or replaces human decision-making within a capability. May declare governed_by (RSK/CTL/REG ids) per the ai-automation-governance dimension.

    - entity_id: dea:entity-data-entity
      class_alias: DE
      display_name: Data Entity
      layer: L4
      building_block: L4-data-foundation
      status: planned
      catalog_repo: dea-catalog-data-entities
      description: A persistent data structure (table, document, graph node) that realises one or more business objects.

    - entity_id: dea:entity-digital-identity
      class_alias: DI
      display_name: Digital Identity
      layer: L4
      building_block: L4-digital-trust
      status: planned
      catalog_repo: dea-catalog-digital-identities
      description: A digital representation (twin) of a stakeholder or actor for authentication, authorisation, and traceability.

    - entity_id: dea:entity-data-product
      class_alias: DP
      display_name: Data Product
      layer: L4
      building_block: L4-data-products
      status: planned
      catalog_repo: dea-catalog-data-products
      description: A curated, discoverable, governed dataset or data service with clear ownership and SLAs (data-mesh pattern).

    - entity_id: dea:entity-event
      class_alias: EVT
      display_name: Event
      layer: L4
      building_block: L4-events
      status: planned
      catalog_repo: dea-catalog-event-streams
      description: A significant state change or business occurrence that business objects participate in.

    - entity_id: dea:entity-information-class
      class_alias: IC
      display_name: Information Class
      layer: L4
      building_block: L4-data-foundation
      status: planned
      catalog_repo: dea-catalog-information-classes
      description: A classification of information by sensitivity and regulatory regime (PII, PHI, PCI).

    - entity_id: dea:entity-information-asset
      class_alias: IA
      display_name: Information Asset
      layer: L4
      building_block: L4-information-knowledge
      status: proposed
      catalog_repo: dea-catalog-information-assets
      entity_role: content
      description: Data given context and form for a specific consuming purpose (a report, dashboard, invoice) — distinct from the raw Data Entity it's contextualized from.

    - entity_id: dea:entity-knowledge-asset
      class_alias: KA
      display_name: Knowledge Asset
      layer: L4
      building_block: L4-information-knowledge
      status: proposed
      catalog_repo: dea-catalog-knowledge-assets
      entity_role: content
      description: Applied know-how made explicit and durable, existing independent of any one Actor — distinct from Skill (L3), which an Actor personally possesses.

    - entity_id: dea:entity-model-deployment
      class_alias: MDP
      display_name: Model Deployment
      layer: L4
      building_block: L4-model-operations
      status: proposed
      catalog_repo: dea-catalog-model-deployments
      description: A running instance of an AI/ML Model, hosted on an Application Component, with its own version, monitoring state, and health.

    - entity_id: dea:entity-model-feedback-signal
      class_alias: MFS
      display_name: Model Feedback Signal
      layer: L4
      building_block: L4-model-operations
      status: proposed
      catalog_repo: dea-catalog-model-deployments
      discriminator: signal_kind
      description: Drift, performance-degradation, or outcome-quality feedback captured from Events, used to trigger retraining of an AI/ML Model.

    - entity_id: dea:entity-application-component
      class_alias: APC
      display_name: Application Component
      layer: L5
      building_block: L5-systems
      status: planned
      catalog_repo: dea-catalog-application-components
      discriminator: component_type
      specializes: SC
      description: A deployable unit of an application system. SubClass of SolutionComponent with component_type='application'.

    - entity_id: dea:entity-api
      class_alias: API
      display_name: API
      layer: L5
      building_block: L5-integration
      status: planned
      catalog_repo: dea-catalog-api-contracts
      description: A contract defining the request/response shape of a service interface.

    - entity_id: dea:entity-infrastructure-component
      class_alias: IFC
      display_name: Infrastructure Component
      layer: L5
      building_block: L5-infrastructure
      status: planned
      catalog_repo: dea-catalog-application-components
      discriminator: component_type
      specializes: SC
      description: An IaC-managed resource that hosts solution components. SubClass of SolutionComponent with component_type='infrastructure'.

    - entity_id: dea:entity-integration-component
      class_alias: IGC
      display_name: Integration Component
      layer: L5
      building_block: L5-integration
      status: planned
      catalog_repo: dea-catalog-application-components
      discriminator: component_type
      specializes: SC
      description: A component that bridges systems via APIs, queues, file transfers. SubClass of SolutionComponent with component_type='integration'.

    - entity_id: dea:entity-platform-service
      class_alias: PS
      display_name: Platform Service
      layer: L5
      building_block: L5-infrastructure
      status: planned
      catalog_repo: dea-catalog-platform-services
      description: A shared infrastructure or runtime service consumed by multiple application components.

    - entity_id: dea:entity-system-function
      class_alias: SF
      display_name: System Function
      layer: L5
      building_block: L5-systems
      status: planned
      catalog_repo: dea-catalog-system-functions
      measured_by: [MTR]
      description: A functional capability exposed by a single application or system.

    - entity_id: dea:entity-technology
      class_alias: TEC
      display_name: Technology
      layer: L5
      building_block: L5-technology
      status: planned
      catalog_repo: dea-catalog-patterns
      discriminator: technology_kind
      description: A technology choice (language, framework, runtime, database) governed via Guardrails, motivated by Tenets.

    - entity_id: dea:entity-metric
      class_alias: MTR
      display_name: Performance Metric
      status: existing
      catalog_repo: dea-catalog-metrics
      scope_layers: [L1, L2, L3, L4, L5]
      description: >
        A measured quantity used to evaluate outcomes against targets.
        MECE taxonomy: kpi | health | maturity | performance | adoption | compliance | risk.
        No longer allocated to a layer/building_block as of v0.2.0 — belongs to
        orthogonal_allocators.measurement-dimension instead (ADR-0002 D1).

repository_tiers:
  - tier: T0
    role: root-model
    repos: [dea-architecture-framework]
    note: This repo. The authoritative definition of layers, building blocks, and allocation.
  - tier: T1
    role: machine-schemas
    repos: [dea-metamodel]
    note: Consumer. Entity schemas, TTL, SQLite, TS/Pydantic types, viewer graph — all generated from / pinned to this model.
  - tier: T2
    role: catalogs
    repos: [dea-catalog-*]
    note: Consumers. Host entity instances; declare allocation via metamodel-pointer.yaml validated against this model.
  - tier: T3
    role: tooling-viewers
    repos: [dea-cli, dea-web-viewer, technehub-labs.github.io]
    note: Consumers. Render and navigate the allocated model.

# Relationship schema (v0.2.0):
#   from, to        : class_alias references
#   label            : human-readable (unchanged from v0.1.0)
#   rel_type         : realization | composition | aggregation | dependency | flow | governance | association
#   cardinality      : "<from-side>:<to-side>", each side in {0..1, 1, 0..N, 1..N}
#   style            : DEPRECATED — derive from rel_type in viewers; retained for T3 back-compat only
relationships:
  - {from: SO, to: II,  label: drives,                    rel_type: governance,   cardinality: "1:0..N"}
  - {from: II, to: CAP, label: funds,                     rel_type: governance,   cardinality: "1:0..N"}
  - {from: VS, to: CAP, label: traverses,                 rel_type: aggregation,  cardinality: "1..N:1..N"}
  - {from: VS, to: JT,  label: experienced via,            rel_type: flow,         cardinality: "1:0..N"}
  - {from: CAP, to: BP, label: implemented by,             rel_type: realization,  cardinality: "1:1..N"}
  - {from: CAP, to: BO, label: produces / consumes,        rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: SH, to: BP,  label: served by,                  rel_type: association,  cardinality: "0..N:0..N"}
  - {from: AC, to: BP,  label: performs,                   rel_type: association,  cardinality: "0..N:0..N"}
  - {from: JT, to: DI,  label: authenticates,               rel_type: dependency,   cardinality: "0..N:1"}
  - {from: DI, to: DE,  label: represented by,              rel_type: realization,  cardinality: "1:1"}
  - {from: BP, to: SF,  label: automated by,                rel_type: realization,  cardinality: "0..N:0..N"}
  - {from: BO, to: DE,  label: digitized as,                rel_type: realization,  cardinality: "1:0..N"}
  - {from: OU, to: BO,  label: custodian of,                rel_type: governance,   cardinality: "1:0..N"}
  - {from: BS, to: BO,  label: exposes,                     rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: DE, to: IC,  label: classified by,               rel_type: governance,   cardinality: "0..N:1..N"}
  - {from: DE, to: DP,  label: curated into,                rel_type: composition,  cardinality: "0..N:0..N"}
  - {from: SF, to: EVT, label: publishes / subscribes,       rel_type: flow,         cardinality: "0..N:0..N"}
  - {from: EVT, to: DE, label: carries payload of,           rel_type: dependency,   cardinality: "0..N:0..1"}
  - {from: DP, to: API, label: exposed via,                  rel_type: realization,  cardinality: "1:1..N"}
  - {from: AIM, to: DP, label: trained on,                   rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: AIM, to: SF, label: enhances / automates,          rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: SF, to: APC, label: hosted by,                    rel_type: composition,  cardinality: "0..N:1"}
  - {from: APC, to: PS, label: deployed on,                  rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: SF, to: API, label: exposed via,                  rel_type: realization,  cardinality: "0..N:0..N"}
  - {from: API, to: DE, label: serves / exchanges,            rel_type: flow,         cardinality: "0..N:0..N"}
  - {from: TEC, to: APC, label: implements,                  rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: SO, to: MTR, label: measured by,                  rel_type: governance,   cardinality: "1:0..N"}
  - {from: CAP, to: MTR, label: evaluated by,                 rel_type: governance,   cardinality: "1:0..N"}
  - {from: SF, to: MTR, label: evaluated by,                  rel_type: governance,   cardinality: "1:0..N"}
  - {from: EA, to: CA,  label: engages in,                   rel_type: association,  cardinality: "0..N:0..N"}
  - {from: CA, to: VE,  label: governs,                      rel_type: governance,   cardinality: "1:0..N"}
  - {from: EA, to: SO,  label: influences,                   rel_type: association,  cardinality: "0..N:0..N"}
  - {from: VE, to: JT,  label: crosses boundary at,           rel_type: flow,         cardinality: "0..N:0..N"}
  - {from: VE, to: BO,  label: transports (payload),          rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: EA, to: DI,  label: represented by,                rel_type: realization,  cardinality: "1:1"}
  - {from: CAP, to: BF, label: grouped by,                   rel_type: aggregation,  cardinality: "0..N:1"}
  - {from: BF, to: OU,  label: owned by,                     rel_type: governance,   cardinality: "1:1"}

  # --- v0.3.0 additions (ADR-0003) ---
  - {from: EP, to: EA,  label: hosts,                        rel_type: aggregation,  cardinality: "1:0..N"}
  - {from: EP, to: API, label: exposed via,                   rel_type: realization,  cardinality: "1:0..N"}
  - {from: RSK, to: CAP, label: threatens,                    rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: RSK, to: SF,  label: threatens,                    rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: CTL, to: RSK, label: mitigates,                    rel_type: governance,   cardinality: "0..N:0..N"}
  - {from: REG, to: CTL, label: mandates,                     rel_type: governance,   cardinality: "1:0..N"}
  - {from: AIM, to: RSK, label: 'subject to (governed_by)',   rel_type: governance,   cardinality: "0..N:0..N"}
  - {from: SIG, to: EXP, label: triggers,                     rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: EXP, to: II,  label: informs,                      rel_type: dependency,   cardinality: "0..N:0..1"}
  - {from: TRE, to: EXP, label: evaluated via,                 rel_type: dependency,   cardinality: "1:0..N"}
  - {from: TRE, to: TEC, label: graduates to,                  rel_type: realization,  cardinality: "0..1:0..1"}
  - {from: SKL, to: ROL, label: required by,                   rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: ROL, to: AC,  label: fulfilled by,                   rel_type: realization,  cardinality: "1:0..N"}
  - {from: CHI, to: OU,  label: targets,                       rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: CHI, to: II,  label: funded by,                     rel_type: governance,   cardinality: "0..N:0..1"}
  - {from: MDP, to: AIM, label: instance of,                   rel_type: realization,  cardinality: "0..N:1"}
  - {from: MDP, to: APC, label: hosted by,                     rel_type: composition,  cardinality: "0..N:1"}
  - {from: MFS, to: EVT, label: derived from,                   rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: MFS, to: AIM, label: triggers retraining of,          rel_type: dependency,   cardinality: "0..N:0..N"}

  # --- v0.4.0 additions (ADR-0004) — closing the six previously-orphaned L2 entities ---
  - {from: TNT, to: GRD, label: informs,                         rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: GRD, to: CTL, label: implements,                       rel_type: realization,  cardinality: "0..N:1"}
  - {from: GRD, to: TEC, label: governs,                          rel_type: governance,   cardinality: "0..N:0..N"}
  - {from: GRD, to: SC,  label: governs,                          rel_type: governance,   cardinality: "0..N:0..N"}
  - {from: BLU, to: AP,  label: composed of,                      rel_type: composition,  cardinality: "1:1..N"}
  - {from: CON, to: CAP, label: defines,                          rel_type: governance,   cardinality: "0..N:0..N"}
  - {from: CON, to: BO,  label: defines,                          rel_type: governance,   cardinality: "0..N:0..N"}

  # --- v0.5.0 additions (ADR-0005) ---
  - {from: FR,  to: II,  label: funds,                            rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: PHR, to: BP,  label: enables,                           rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: INR, to: CAP, label: protects,                          rel_type: governance,   cardinality: "0..N:0..N"}
  - {from: IA,  to: DE,  label: contextualized from,                 rel_type: dependency,   cardinality: "0..N:1..N"}
  - {from: IA,  to: AC,  label: consumed by,                         rel_type: flow,         cardinality: "0..N:0..N"}
  - {from: KA,  to: AC,  label: captured from,                       rel_type: dependency,   cardinality: "0..N:0..N"}
  - {from: KA,  to: TNT, label: informs,                             rel_type: dependency,   cardinality: "0..N:0..N"}
