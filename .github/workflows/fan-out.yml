name: fan-out

# Dispatches a model-changed event to direct consumers when the model changes
# on main. Consumers (dea-metamodel first, Phase 2) listen for
# repository_dispatch type `opendeam-model-changed` to regenerate their
# derived artifacts (entity-graph.json → PUML → SVG → pages → viewers).
#
# PHASE 2 WIRING: active as of v0.2.0 — secrets.MODEL_SYNC_TOKEN (PAT, repo
# scope on the org) is configured and dea-metamodel has its receiver workflow
# (repository_dispatch: opendeam-model-changed). The push trigger below fires
# only when the model or VERSION changes on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "model/**"
      - "VERSION"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to dea-metamodel
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MODEL_SYNC_TOKEN }}
          repository: technehub-labs/dea-metamodel
          event-type: opendeam-model-changed
          client-payload: >-
            {"model_version": "${{ github.sha }}",
             "ref": "${{ github.ref }}"}
