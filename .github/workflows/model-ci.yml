name: model-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate OpenDEAM model (schema + integrity)
        run: python3 scripts/validate_model.py
