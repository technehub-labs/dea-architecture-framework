- open_deam: dea:entity-system-function
  metamodel: dea:InformationSystemFunction
  open_deam_class_alias: SF
  metamodel_class_alias: ISF
  cr: CR-018
  disposition: D-1
  note: EGV-004 identity continuity; the legacy entity dea:entity-system-function is retained in OpenDEAM
    with class_alias SF; the new canonical entity in the metamodel is dea:InformationSystemFunction (class_alias
    ISF). Both are allocated to L5/L5-systems.
  relationship: supersedes
