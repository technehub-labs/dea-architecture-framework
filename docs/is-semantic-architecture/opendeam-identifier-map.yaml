- open_deam: dea:entity-api
  metamodel: dea:API
  open_deam_class_alias: API
  cr: CR-021
  disposition: D-4
  note: contract entity; in the metamodel, dea:API sources the new dea:specifies relationship targeting
    dea:IntegrationInterface. In OpenDEAM, this is recorded via the API -> IF 'specifies' edge (rel_type
    'contract').
- open_deam: dea:entity-integration-interface
  metamodel: dea:IntegrationInterface
