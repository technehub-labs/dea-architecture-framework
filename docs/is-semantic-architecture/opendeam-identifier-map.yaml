notes:
- The map covers entity identifiers only; relationship identifier maps are owned by the relationship entries
  in the model (and the new relationships added in CR-AR-FMWK-04).
- 'The map is bidirectional: a reader can look up either open_deam or metamodel side.'
- The class_alias mapping is critical for OpenDEAM's MECE allocation pattern; the IF alias was chosen
  to avoid the II (Investment Initiative) collision.
- The map does not include catalogue-level identifiers; those are owned by CR-IS-CAT-01..04.
- The map does not include the rel_type controlled vocabulary mapping; the three new rel_type values (execution,
  serving, contract) are recorded in schemas/opendeam-model.schema.json.
- 'CR-AR-FMWK-04 closure: the canonical OpenDEAM-to-metamodel identifier map is at docs/is-semantic-architecture/opendeam-identifier-map.yaml
  in this repository; the dea-metamodel stub at docs/is-semantic-architecture/opendeam-identifier-map.yaml
  is consumed by CR-AR-FMWK-04 and the catalog CRs.'
- 'CR-AR-FMWK-05: the twelve Metric entities are allocated to the measurement-dimension overlay rather
  than to a layer, following ADR-0002 D1 as dea:entity-metric already does. Their class_alias values are
  assigned canonically in dea-metamodel and are unique there. dea:IntegrationInterface was II in the metamodel
  and is now IFI, because II was bound to dea:entity-investment-initiative in the consumed viewer graph;
  this continues the earlier IF choice, which avoided the same collision for InfrastructureComponent.'
